apiVersion: v1
kind: Namespace
metadata:
  name: ai-code-review

---
apiVersion: v1
kind: Secret
metadata:
    name: api-keys
    namespace: ai-code-review
type: Opaque
stringData:
    OPENAI_API_KEY: "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"
    GOOGLE_APPLICATION_CREDENTIALS: "/app/credentials/google-credentials.json"

---
apiVersion: v1
kind: Secret
metadata:
  name: google-credentials
  namespace: ai-code-review
type: Opaque
data:
  google-credentials.json: ""

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: backend-storage
  namespace: ai-code-review
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-deployment
  namespace: ai-code-review
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
      - name: backend
        image: us-central1-docker.pkg.dev/ai-bugger/ai-code-review-platform/backend:v1.1
        ports:
        - containerPort: 8000
        env:
        - name: OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: api-keys
              key: OPENAI_API_KEY
        - name: GOOGLE_APPLICATION_CREDENTIALS
          valueFrom:
            secretKeyRef:
              name: api-keys
              key: GOOGLE_APPLICATION_CREDENTIALS
        - name: PYTHONPATH
          value: "/app"
        volumeMounts:
        - name: storage
          mountPath: /app/logs
        - name: google-creds
          mountPath: /app/credentials
          readOnly: true
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 5
      volumes:
      - name: storage
        persistentVolumeClaim:
          claimName: backend-storage
      - name: google-creds
        secret:
          secretName: google-credentials

---
apiVersion: v1
kind: Service
metadata:
  name: backend-service
  namespace: ai-code-review
spec:
  type: ClusterIP
  selector:
    app: backend
  ports:
  - port: 8000
    targetPort: 8000

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-deployment
  namespace: ai-code-review
spec:
  replicas: 3
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
      - name: frontend
        image: us-central1-docker.pkg.dev/ai-bugger/ai-code-review-platform/frontend:v1.0
        ports:
        - containerPort: 80
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 10
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 10

---
apiVersion: v1
kind: Service
metadata:
  name: frontend-service
  namespace: ai-code-review
spec:
  type: LoadBalancer
  selector:
    app: frontend
  ports:
  - port: 80
    targetPort: 80

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ai-code-review-ingress
  namespace: ai-code-review
  annotations:
    kubernetes.io/ingress.class: "gce"
    kubernetes.io/ingress.global-static-ip-name: "ai-code-review-ip"
spec:
  rules:
  - host: your-domain.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: frontend-service
            port:
              number: 80